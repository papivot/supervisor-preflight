apiVersion: v1
kind: ServiceAccount
metadata: {name: app}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata: {name: app-role}
rules:
- {apiGroups: [""], resources: [configmaps], verbs: [get, list]}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata: {name: app-rb}
roleRef: {apiGroup: rbac.authorization.k8s.io, kind: Role, name: app-role}
subjects: [{kind: ServiceAccount, name: app}]
