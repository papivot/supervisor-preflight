apiVersion: batch/v1
kind: Job
metadata:
  name: pre-job
  annotations: {"helm.sh/hook": pre-install}
spec:
  template:
    spec:
      restartPolicy: Never
      containers: [{name: j, image: busybox, command: ["true"]}]
---
apiVersion: monitoring.coreos.com/v1
kind: ServiceMonitor
metadata: {name: sm}
spec: {selector: {matchLabels: {app: x}}, endpoints: [{port: http}]}
