apiVersion: v1
kind: ConfigMap
metadata: {name: ok-cfg}
data: {a: b}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata: {name: huge-pvc}
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: vsan-default-storage-policy
  resources: {requests: {storage: 500Ti}}
---
apiVersion: apps/v1
kind: Deployment
metadata: {name: priv}
spec:
  replicas: 1
  selector: {matchLabels: {app: priv}}
  template:
    metadata: {labels: {app: priv}}
    spec:
      hostNetwork: true
      containers:
      - name: c
        image: busybox
        securityContext: {privileged: true}
---
apiVersion: v1
kind: Service
metadata: {name: bad-svc}
spec: {selector: {app: x}, ports: [{port: 0}]}
